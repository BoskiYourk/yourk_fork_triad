- type: pointOfInterest
  id: CargoDepot
  parent: [BasePOI, BaseRepairablePOI]
  name: Cargo Depot
  minimumDistance: 8000
  maximumDistance: 10000
  spawnGroup: CargoDepot
  gridPath: /Maps/_Triad/POI/cargodepot.yml
  addComponents: &cargoComponents
  - type: IFF
    color: "#37C837"
  - type: ProtectedGrid
    preventArtifactTriggers: true
  - type: SolarPoweredGrid
    trackOnInit: true
    doNotCull: true
  - type: WorldGenDistanceCarver
    distanceThresholds:
    # Dead zone
    - maxDistance: 500
      prob: 0.0
    - maxDistance: 1000
      prob: 0.3

- type: pointOfInterest
  id: CargoDepotAlt
  parent: [BasePOI, BaseRepairablePOI]
  name: Cargo Depot
  minimumDistance: 8000
  maximumDistance: 10000
  spawnGroup: CargoDepot
  gridPath: /Maps/_Triad/POI/cargodepotalt.yml
  addComponents: *cargoComponents

- type: gameMap
  id: CargoDepot
  mapName: 'Cargo Depot' # Has a letter appended in PointOfInterestSystem
  mapPath: /Maps/_Triad/POI/cargodepotalt.yml
  minPlayers: 0
  stations:
    CargoDepot:
      stationProto: StandardFrontierOutpost
      components: &cargoStationComponents
      - type: StationNameSetup
        mapNameTemplate: 'Cargo Depot' # Has a letter appended in PointOfInterestSystem
      - type: TradeCrateDestination
        destinationProto: CargoA # Redefined in PointOfInterestSystem

- type: gameMap
  id: CargoDepotAlt
  mapName: 'Cargo Depot' # Has a letter appended in PointOfInterestSystem
  mapPath: /Maps/_Triad/POI/cargodepotalt.yml
  minPlayers: 0
  stations:
    CargoDepotAlt:
      stationProto: StandardFrontierOutpost
      components: *cargoStationComponents
